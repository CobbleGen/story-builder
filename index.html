<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan, write and revise your novel: arcs and beats on a chapter board, the manuscript, story time and mind maps. It works in your browser, with an account to keep your stories in if you like." />
    <!-- How a link to it looks when shared (public/og-image.png). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arc Creator" />
    <meta property="og:title" content="Arc Creator" />
    <meta property="og:description" content="Plan, write and revise your novel: arcs and beats on a chapter board, the manuscript, story time and mind maps." />
    <meta property="og:url" content="https://arccreator.vercel.app/" />
    <meta property="og:image" content="https://arccreator.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arc Creator: a ring in eight segments beside the name, over coloured arc lines" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f3f1ec" />
    <title>Arc Creator</title>
    <script>
      // Pick light or dark before anything paints (the app keeps it in step afterwards).
      try {
        var theme = (JSON.parse(localStorage.getItem('story-builder:ui') || '{}').state || {}).theme || 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
